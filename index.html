<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>TeraAI Chat</title>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css" />
		<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
		<style>
			:root {
				--bg: #0b0e14;
				--panel: #0f1320;
				--panel-2: #12182b;
				--text: #e6e9ef;
				--muted: #a0a7b5;
				--accent: #10a37f;
				--accent-2: #2dd4bf;
				--user-bubble: #1e293b;
				--ai-bubble: #0f172a;
				--border: #1c2236;
			}
			body {
				background: radial-gradient(1200px 600px at 10% -10%, #0f172a 20%, transparent),
					radial-gradient(1000px 500px at 90% -20%, #0b1324 10%, transparent),
					var(--bg);
				color: var(--text);
			}
			.container {
				max-width: 860px;
				margin: 24px auto;
				padding: 0 12px;
			}
			h2 {
				font-weight: 700;
				font-size: 1.25rem;
				margin: 0 0 12px 0;
			}
			.header {
				display: flex;
				align-items: center;
				gap: 10px;
				background: linear-gradient(180deg, var(--panel), var(--panel-2));
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 12px 14px;
				box-shadow: 0 8px 24px rgba(0,0,0,0.25);
			}
			.logo {
				width: 28px; height: 28px;
				border-radius: 8px;
				background: linear-gradient(135deg, var(--accent), var(--accent-2));
				display: grid; place-items: center;
				font-weight: 800; color: #0b0e14;
			}
			.subtitle { color: var(--muted); font-size: .85rem; }

			/* Chat layout */
			.chat {
				margin-top: 14px;
				height: calc(100vh - 240px);
				min-height: 360px;
				overflow-y: auto;
				background: linear-gradient(180deg, var(--panel), var(--panel-2));
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 16px;
				box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
			}
			.message {
				max-width: 78%;
				padding: 12px 14px;
				border-radius: 16px;
				margin: 8px 0;
				line-height: 1.55;
				word-wrap: break-word;
				box-shadow: 0 1px 0 rgba(255,255,255,0.03), 0 6px 18px rgba(0,0,0,0.25);
			}
			.message.user {
				background: linear-gradient(180deg, #1f2937, var(--user-bubble));
				margin-left: auto;
				border-bottom-right-radius: 6px;
				border: 1px solid #263248;
			}
			.message.ai {
				background: linear-gradient(180deg, #0b1222, var(--ai-bubble));
				margin-right: auto;
				border-bottom-left-radius: 6px;
				border: 1px solid #1a2033;
			}
			.message .name {
				font-size: 0.75rem;
				font-weight: 700;
				letter-spacing: .02em;
				color: var(--muted);
				margin-bottom: 6px;
			}
			.message :is(h1,h2,h3) { margin: 0 0 8px 0; font-size: 1rem; }
			.message pre { background: #0b1222; border: 1px solid #1a2033; padding: 10px; border-radius: 10px; overflow: auto; }
			.message code { color: #cbd5e1; }

			/* Typing indicator */
			.typing { display: inline-flex; gap: 6px; align-items: center; }
			.dot { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite ease-in-out; }
			.dot:nth-child(2) { animation-delay: 0.15s; }
			.dot:nth-child(3) { animation-delay: 0.3s; }
			@keyframes bounce { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

			/* Composer */
			.composer {
				display: flex; gap: 10px; align-items: center;
				background: linear-gradient(180deg, var(--panel), var(--panel-2));
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 10px;
				margin-top: 14px;
				box-shadow: 0 8px 24px rgba(0,0,0,0.25);
			}
			#userInput {
				background: #0b1222;
				border: 1px solid #1a2033;
				color: var(--text);
				border-radius: 10px;
				padding: 12px 14px;
			}
			#userInput::placeholder { color: #7a8699; }
			.btn.btn-success {
				background: linear-gradient(135deg, var(--accent), var(--accent-2));
				border: none;
				color: #0b0e14;
				font-weight: 700;
				border-radius: 10px;
				padding: 10px 16px;
				box-shadow: 0 10px 24px rgba(16,163,127,0.35);
			}
			.btn.btn-success:disabled { filter: grayscale(0.2) brightness(0.8); box-shadow: none; }

			/* Legacy response area (hidden) */
			#response { display: none; }
		</style>
	</head>
	<body>
		<div class="container">
			<div class="header">
				<div class="logo">T</div>
				<div>
					<h2 style="margin:0">TeraAI</h2>
					<div class="subtitle">Your modern AI assistant</div>
				</div>
			</div>
			<div id="chat" class="chat"></div>
			<div class="composer form-group" style="margin-bottom:0;">
				<input
					type="text"
					class="form-control"
					id="userInput"
					placeholder="Message TeraAI..." />
				<button class="btn btn-success" onclick="sendMessage()">Send</button>
			</div>
			<div id="response" style="display:none;"></div>
		</div>
		<script>
			function addMessage(role, htmlContent) {
				const chat = document.getElementById('chat');
				const bubble = document.createElement('div');
				bubble.className = `message ${role}`;
				if (role === 'ai') {
					const name = document.createElement('div');
					name.className = 'name';
					name.textContent = 'TeraAI';
					bubble.appendChild(name);
				}
				const content = document.createElement('div');
				content.innerHTML = htmlContent;
				bubble.appendChild(content);
				chat.appendChild(bubble);
				chat.scrollTop = chat.scrollHeight;
				return bubble;
			}

			function showTyping() {
				return addMessage('ai', `<div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`);
			}

			async function sendMessage() {
				const inputEl = document.getElementById('userInput');
				const input = inputEl.value;
				const responseDiv = document.getElementById('response');
				const btn = document.querySelector('button.btn.btn-success');
				if (!input) {
					responseDiv.innerHTML = 'Please enter a message.';
					return;
				}
				// Add user bubble
				addMessage('user', input.replace(/</g, '&lt;'));
				inputEl.value = '';
				// Typing indicator
				const typingEl = showTyping();
				if (btn) { btn.disabled = true; btn.textContent = 'Asking...'; }
				try {
					const response = await fetch('/api/chat', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json'
						},
						body: JSON.stringify({ message: input })
					});
					const data = await response.json();
					if (!response.ok) {
						const retry = data?.retryAfter ? ` Retry after: ${data.retryAfter}s` : '';
						const msg = (data?.error || `Request failed (${response.status})`) + retry;
						typingEl.remove();
						addMessage('ai', `<strong>${msg}</strong>`);
						return;
					}
					const markdownText = data.choices?.[0]?.message?.content || 'No response received.';
					typingEl.remove();
					addMessage('ai', marked.parse(markdownText));
				} catch (error) {
					typingEl.remove();
					addMessage('ai', '<strong>Error:</strong> ' + error.message);
				} finally {
					if (btn) { btn.disabled = false; btn.textContent = 'Ask!'; }
				}
			}
		</script>
	</body>
</html>
